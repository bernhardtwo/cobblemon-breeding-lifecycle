usage.headerHeading = Breeding lifecycle simulator%n
command.root = Simulates the per-parent loss curve of breeding.
command.curve = Prints n, p(n), S(n) and the expected offspring per parent E.
command.simulate = Monte Carlo: offspring per parent, percentiles and distribution.
command.compare = Compares the curve with the current system of one offspring per parent.
option.lang = Output language: es or en. Default: the system language if Spanish, otherwise English.
option.config = JSON config file, the same one the mod reads. Default: the built-in default preset.
option.ditto = Use the Ditto curve.
option.parents = Number of simulated parents (default: ${DEFAULT-VALUE}).
option.seed = Random seed; the same seed reproduces the same run. Default: a random seed, printed.
curve.main = main curve
curve.ditto = Ditto curve
curve.noLimit = none
curve.header = Curve ({0}): p1 = {1}, r = {2}, maxBreedings = {3}
curve.expectedNote = Expected offspring per parent:
simulate.header = Simulation: {0} parents, seed {1}
simulate.mean = Offspring per parent: mean {0} (exact E = {1})
simulate.percentiles = Percentiles: p50 = {0} · p90 = {1} · p99 = {2} · max = {3}
simulate.distribution = Distribution (offspring · parents · share):
compare.perParent = Offspring/parent
compare.perPair = Offspring/pair
compare.current = Current system
compare.lifecycle = Breeding lifecycle
compare.difference = Difference per parent: {0} ({1})
error.config = Invalid config:
error.read = Cannot read {0}: {1}
error.parents = --parents = {0}: must be >= 1
